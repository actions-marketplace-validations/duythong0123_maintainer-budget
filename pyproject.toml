[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "maintainer-budget"
version = "0.1.0a1"
description = "Turn repeated maintainer review feedback into evidence-backed repository rules."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "duythong0123"}]
keywords = ["github", "pull-request", "maintainer", "code-review", "agents", "agents-md", "open-source"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Quality Assurance",
]

[project.scripts]
maintainer-budget = "maintainer_budget.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
